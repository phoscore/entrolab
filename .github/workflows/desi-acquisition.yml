name: DESI offline build
on:
  push:
    branches: [feature/v0.9.5-explorer-deep-sky-2cb]
    paths: ['.github/workflows/desi-acquisition.yml', 'scripts/build-deep-sky.mjs']
permissions:
  contents: write
jobs:
  build-atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and reproduce immutable release
        run: |
          node scripts/build-deep-sky.mjs --build
          node scripts/build-deep-sky.mjs --check
      - name: Preserve the reproducible package on the feature branch
        run: |
          test "$GITHUB_REF" = refs/heads/feature/v0.9.5-explorer-deep-sky-2cb
          git add dist/explorer/desi-pin.mjs dist/explorer/data/v0.9.5-desi-dr1-bgs-z025.1/
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m '[CF-Pages-Skip] data(explorer): package versioned DESI atlas for offline use'
          git push origin "HEAD:$GITHUB_REF"
