name: Stellar Neighborhood acquisition
on:
  push:
    branches: [feature/v0.9.5-explorer-stellar-neighborhood]
    paths: ['.github/workflows/neighborhood-acquisition.yml', 'scripts/fetch-neighborhood.py']
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install astropy==7.2.0
      - name: Capture complete local selection, with measured pilot fallback
        run: |
          python scripts/fetch-neighborhood.py cosmic-explorer/neighborhood/source 25 14 ||
            python scripts/fetch-neighborhood.py cosmic-explorer/neighborhood/source 10 14
      - uses: actions/upload-artifact@v4
        with:
          name: stellar-neighborhood-source
          path: cosmic-explorer/neighborhood/source
          if-no-files-found: error
      - name: Preserve captures on feature ref
        run: |
          test "$GITHUB_REF" = refs/heads/feature/v0.9.5-explorer-stellar-neighborhood
          git add cosmic-explorer/neighborhood/source
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m '[CF-Pages-Skip] data(explorer): freeze local Gaia and geometric distance references'
          git push origin "HEAD:$GITHUB_REF"
