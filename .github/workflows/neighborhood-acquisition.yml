name: Stellar Neighborhood offline build
on:
  push:
    branches: [feature/v0.9.5-explorer-stellar-neighborhood]
    paths:
      - '.github/workflows/neighborhood-acquisition.yml'
      - 'scripts/build-neighborhood.mjs'
      - 'cosmic-explorer/neighborhood-build.mjs'
      - 'dist/explorer/foundation/neighborhood-format.mjs'
permissions:
  contents: write
jobs:
  reproducible-package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and verify from frozen original data
        run: |
          node scripts/build-neighborhood.mjs --build
          node scripts/build-neighborhood.mjs --check
      - name: Preserve verified output on feature ref
        run: |
          test "$GITHUB_REF" = refs/heads/feature/v0.9.5-explorer-stellar-neighborhood
          git add dist/explorer/data/v0.9.5-neighborhood-25pc-g14.1 dist/explorer/neighborhood-pin.mjs
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m '[CF-Pages-Skip] Freeze byte-reproducible Stellar Neighborhood package'
          git push origin "HEAD:$GITHUB_REF"
