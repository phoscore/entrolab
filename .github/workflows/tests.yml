name: ENTROLAB integration
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  physics-and-original:
    name: Physics and data integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax, conservation, analytical Kepler and collision regressions
        run: node scripts/test.mjs
      - name: Verify twelve unchanged complete numerical benchmarks
        run: node scripts/check-benchmarks.mjs
      - name: Verify preserved v0.1 source commit
        run: node scripts/verify-original.mjs

  browser-review:
    name: Chromium UX regressions
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Full Chromium regression suite
        run: npm run test:browser
      - name: Package review evidence
        if: always()
        run: node scripts/package-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chromium-review-measurements
          path: browser-results/
          if-no-files-found: ignore
          retention-days: 7

  capture-small-bodies:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/v0.9.5-beyond-the-planets'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Snapshot, build and verify JPL release
        run: |
          node scripts/small-bodies.mjs --capture
          node scripts/small-bodies.mjs --build
          node scripts/small-bodies.mjs --check
      - name: Commit reviewed-format data to the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cosmic-explorer/data/raw/v0.9.5-horizons-small-bodies.1 dist/explorer/data/v0.9.5-horizons-small-bodies.1 dist/explorer/small-bodies-release.mjs
          git commit -m '[CF-Pages-Skip] Archive validated small-body Horizons and SBDB data'
          git push origin HEAD:refs/heads/feature/v0.9.5-beyond-the-planets
