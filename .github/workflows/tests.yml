name: ENTROLAB integration
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  physics-and-original:
    name: Physics and data integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax, conservation, analytical Kepler and collision regressions
        run: node scripts/test.mjs
      - name: Verify twelve unchanged complete numerical benchmarks
        run: node scripts/check-benchmarks.mjs
      - name: Verify preserved v0.1 source commit
        run: node scripts/verify-original.mjs

  browser-review:
    name: Chromium UX regressions
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Full Chromium regression suite
        run: npm run test:browser
      - name: Package review evidence
        if: always()
        run: node scripts/package-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chromium-review-measurements
          path: browser-results/
          if-no-files-found: ignore
          retention-days: 7

  horizons-release:
    name: Store the verified Horizons release
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/v0.9.5-our-home-new-worlds'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: new-worlds-reconstruction
          run-id: 44169053408
          github-token: ${{ github.token }}
      - name: Verify and commit the versioned source and packages
        run: |
          node scripts/new-worlds.mjs --check
          git add -- cosmic-explorer/data/raw/v0.9.5-horizons-2025-2030.1 dist/explorer/data/v0.9.5-horizons-2025-2030.1
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m '[CF-Pages-Skip] Archive verified Horizons data and three Moon-system packages'
          git push origin HEAD:refs/heads/feature/v0.9.5-our-home-new-worlds
