name: ENTROLAB integration
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  physics-and-original:
    name: Physics and data integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax, conservation, analytical Kepler and collision regressions
        run: node scripts/test.mjs
      - name: Verify twelve unchanged complete numerical benchmarks
        run: node scripts/check-benchmarks.mjs
      - name: Verify preserved v0.1 source commit
        run: node scripts/verify-original.mjs

  browser-review:
    name: Chromium UX regressions
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Full Chromium regression suite
        run: npm run test:browser
      - name: Package review evidence
        if: always()
        run: node scripts/package-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chromium-review-measurements
          path: browser-results/
          if-no-files-found: ignore
          retention-days: 7
